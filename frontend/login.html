<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TAMSA Election</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <img src="images/logo_placeholder.png" alt="TAMSA Logo">
        <span>TAMSA GENERAL ELECTION 25/26</span>
        <img src="images/logo_placeholder.png" alt="Logo Placeholder">
    </header>

    <div class="container">
        <div class="login-form">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="loginBtn">Login</button>
            <p id="loginMessage"></p>
        </div>
    </div>

    <footer class="footer">
        <img src="images/logo_placeholder.png" alt="Logo Placeholder">
        <span>&copy; 2024 TAMSA. All rights reserved.</span>
        <span>Secured by mofas</span>
        <img src="images/logo_placeholder.png" alt="Logo Placeholder">
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
